# The editor's own container: its files under /editor/ (as the site serves it:
# the portal's nginx passes /editor/ here). Every other path of the site is the
# portal's.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite's hashed bundles never change
    location /editor/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # the app: its pages are the router's (/editor/p/<project>/jokers/0, /editor/reference ...)
    location /editor/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /editor/index.html;
    }

    location = /editor {
        return 301 /editor/$is_args$args;
    }
}
